hardening_enable_fail2ban: true

# Aliased, not hardcoded — real values come from inventory/group_vars/all.yml,
# generated by scripts/generate-inventory.sh straight from `terraform output`.
# That file is gitignored (same reason terraform.tfvars is); if it's missing,
# this fails loudly on an undefined variable rather than falling back silently.
hardening_admin_cidrs: "{{ admin_cidrs }}"
hardening_k3s_cidr: "{{ vpc_cidr }}"

hardening_swap_size_gb: 2
hardening_swappiness: 10
