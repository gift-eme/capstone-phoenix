---
- name: Check current swap status
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: swapon_status
  changed_when: false

- name: Create swap file
  ansible.builtin.command: "fallocate -l {{ hardening_swap_size_gb }}G /swapfile"
  args:
    creates: /swapfile

- name: Set swap file permissions
  ansible.builtin.file:
    path: /swapfile
    owner: root
    group: root
    mode: "0600"

- name: Format swap file
  ansible.builtin.command: mkswap /swapfile
  when: "'/swapfile' not in swapon_status.stdout"

- name: Enable swap file
  ansible.builtin.command: swapon /swapfile
  when: "'/swapfile' not in swapon_status.stdout"

- name: Persist swap file in fstab
  ansible.posix.mount:
    path: none
    src: /swapfile
    fstype: swap
    opts: sw
    state: present

- name: Prefer RAM over swap (lower swappiness)
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ hardening_swappiness }}"
    sysctl_set: true
    state: present
    reload: true

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
  when: hardening_enable_fail2ban

- name: Enforce SSH hardening in sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    validate: "sshd -t -f %s"
  loop:
    - { regexp: "^#?PasswordAuthentication", line: "PasswordAuthentication no" }
    - { regexp: "^#?PermitRootLogin", line: "PermitRootLogin no" }
    - { regexp: "^#?PubkeyAuthentication", line: "PubkeyAuthentication yes" }
  notify: Restart sshd

- name: Set ufw default policies
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

- name: Allow SSH from admin CIDRs only
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    src: "{{ item }}"
  loop: "{{ hardening_admin_cidrs }}"

- name: Allow HTTP/HTTPS from anywhere
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "80"
    - "443"

- name: Allow kube-apiserver from admin CIDRs (kubectl access)
  community.general.ufw:
    rule: allow
    port: "6443"
    proto: tcp
    src: "{{ item }}"
  loop: "{{ hardening_admin_cidrs }}"

- name: Allow k3s node-to-node traffic within the VPC
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    src: "{{ hardening_k3s_cidr }}"
  loop:
    - { port: "6443", proto: tcp } # kube-apiserver: agent join
    - { port: "8472", proto: udp } # flannel VXLAN
    - { port: "10250", proto: tcp } # kubelet API
    - { port: "8443", proto: tcp } # ingress-nginx admission webhook (hostNetwork: true binds this on the host itself)

- name: Enable ufw
  community.general.ufw:
    state: enabled

- name: Ensure fail2ban is enabled and started
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
  when: hardening_enable_fail2ban
