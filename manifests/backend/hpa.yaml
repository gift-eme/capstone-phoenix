apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: taskapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  # Capped low on purpose: 2 worker nodes with ~1GB RAM each — maxReplicas: 10
  # (a common default) isn't realistically supportable here. Temporarily
  # capped at 2 (== minReplicas, effectively disabling scale-up) after a
  # cluster-wide instability event: HPA scaling to 4 under CPU spikes caused
  # by the instability itself was making things worse, not better. Revisit
  # once the cluster is stable again.
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
