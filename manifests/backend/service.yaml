apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: taskapp
  labels:
    app: backend
    tier: api
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 5000 # frontend's nginx.conf hardcodes proxy_pass http://backend:5000/api/
      targetPort: 5000
      name: http
